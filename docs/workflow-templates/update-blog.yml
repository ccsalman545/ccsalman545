name: Refresh latest writing

on:
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-blog
  cancel-in-progress: false

jobs:
  refresh:
    # Configure Settings → Secrets and variables → Actions → Variables → BLOG_RSS_URL first.
    if: ${{ vars.BLOG_RSS_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update the writing section from RSS or Atom
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: ${{ vars.BLOG_RSS_URL }}
          max_post_count: 4
          template: "$newline- [$title]($url) — $date"
          comment_tag_name: "BLOG-POST-LIST"
          commit_message: "chore: refresh latest writing [skip ci]"
          enable_keepalive: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
